<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Player</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Radio Player</h1>

      <div class="station-list">
        <button class="station-btn" data-url="https://stream-uk1.radioparadise.com/mp3-192">
          Radio Paradise
        </button>

        <button class="station-btn" data-url="https://stream.live.vc.bbcmedia.co.uk/bbc_world_service">
          BBC World Service
        </button>

        <button class="station-btn" data-url="https://stream.radiorecord.ru:8102/rr_128">
          Radio Record
        </button>
      </div>

      <div class="controls">
        <button id="stopBtn" class="stop-btn">Stop</button>
      </div>

      <div class="status-box">
        <span id="statusText">Stopped</span>
      </div>

      <audio id="audioPlayer" controls></audio>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
