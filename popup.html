<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Player</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Worldwide Radio</h1>

      <div class="station-list">
        <button class="station-btn" data-url="https://stream-uk1.radioparadise.com/mp3-192">
          Radio Paradise (US)
        </button>

        <button class="station-btn" data-url="https://stream.live.vc.bbcmedia.co.uk/bbc_world_service">
          BBC World Service (UK)
        </button>

        <button class="station-btn" data-url="https://npr-ice.streamguys1.com/live.mp3">
          NPR News (US)
        </button>

        <button class="station-btn" data-url="https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3">
          Deutschlandfunk (Germany)
        </button>

        <button class="station-btn" data-url="http://direct.franceculture.fr/live/franceculture-midfi.mp3">
          France Culture (France)
        </button>

        <button class="station-btn" data-url="https://cbc_r1_tor.akacast.akamaistream.net/7/385/451661/v1/rc.akacast.akamaistream.net/cbc_r1_tor">
          CBC Radio One (Canada)
        </button>

        <button class="station-btn" data-url="https://voa-ingest.akamaized.net/hls/live/2033874/voa1/master.m3u8">
          VOA News (USA)
        </button>

        <button class="station-btn" data-url="https://media-ice.musicradio.com/ClassicFMMP3">
          Classic FM (UK)
        </button>
      </div>

      <div class="controls">
        <button id="stopBtn" class="stop-btn">Stop</button>
      </div>

      <div class="status-box">
        <span id="statusText">Stopped</span>
      </div>

      <audio id="audioPlayer" controls></audio>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
