<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worldwide Radio</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Worldwide Radio</h1>

      <div class="search-box">
        <input id="searchInput" type="text" placeholder="Search stations (e.g. jazz, news, rock)" />
        <button id="searchBtn" class="primary-btn">Search</button>
      </div>

      <div class="search-results">
        <h2>Public Stations</h2>
        <div id="stationResults" class="station-list"></div>
      </div>

      <div class="favorites-box">
        <h2>Favorites</h2>
        <div id="favoriteList" class="station-list small-list"></div>
      </div>

      <div class="custom-box">
        <h2>Add Your Own Station</h2>
        <input id="customName" type="text" placeholder="Station name" />
        <input id="customUrl" type="text" placeholder="https://example.com/radio-stream" />
        <button id="addCustomBtn" class="primary-btn">Add Station</button>
        <div id="customList" class="station-list small-list"></div>
      </div>

      <div class="controls">
        <button id="stopBtn" class="stop-btn">Stop</button>
      </div>

      <div class="status-box">
        <span id="statusText">Stopped</span>
      </div>

      <audio id="audioPlayer" controls></audio>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
